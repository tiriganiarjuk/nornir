# The error registry — every failure mode a nornir tool can refuse or fail with, written once
# (HOW_A_NORNIR_TOOL_IS_MADE.md § The error registry).
#
# Each entry becomes a function of failure_mode_core, named after the entry, whose parameters
# are the {slots} its texts name. An engine refers to an entry by calling that function, so a
# name with no entry, or a slot left unfilled, does not compile; a missing or unknown field
# fails the build.
#
#   class        the error.type callers branch on
#   standard     what was refused or failed, and where — with its {slots}
#   route        what to do next; it never leads around the constraint that refused
#   adversarial  what an opaque or possibly hostile user is told: "stop", the shared stop order
#   alert        Hlidskjalf Alert priority in adversarial mode (trace, low, normal, high,
#                critical); omitted = no alert

[file_unreadable]
class       = "read_error"
standard    = "Cannot read '{path}': {reason}."
route       = "Check that the path is right and the file is there; if it is, ask the user why it cannot be read."
adversarial = "stop"
alert       = "high"

[file_unwritable]
class       = "write_error"
standard    = "Cannot write '{path}': {reason}."
route       = "Check that the path is the one you were given to write; if it is, ask the user why it cannot be written."
adversarial = "stop"

[text_not_json]
class       = "parse_error"
standard    = "The text handed over for '{path}' is not valid JSON: {reason}."
route       = "Hand over the data as JSON text, serialized by a JSON library."
adversarial = "stop"

[schema_unreadable]
class       = "schema_error"
standard    = "Cannot read schema '{path}': {reason}."
route       = "Check that the schema name and schema directory are right and the schema file is there; if it is, ask the user why it cannot be read."
adversarial = "stop"

[schema_not_json]
class       = "schema_error"
standard    = "Schema '{path}' is not valid JSON: {reason}."
route       = "Report the schema's path and this message to the user; the schema is corrected before the call is made again."
adversarial = "stop"

[schema_not_compilable]
class       = "schema_error"
standard    = "Schema '{path}' is not valid JSON Schema: {reason}."
route       = "Report the schema's path and this message to the user; the schema is corrected before the call is made again."
adversarial = "stop"

[file_not_in_format]
class       = "parse_error"
standard    = "'{path}' is not valid {format}: {reason}."
route       = "The file is not in the format this tool reads. Report its path and this message to the user; the file is corrected before it is read again."
adversarial = "stop"

[conversion_produced_invalid_json]
class       = "conversion_error"
standard    = "Converting {format} to JSON produced invalid JSON: {reason}."
route       = "This is a fault in the conversion, not in the file. Report this message to the user."
adversarial = "stop"

[data_not_matching_schema]
class       = "validation_error"
standard    = "{report}"
route       = "Correct the data so it matches the schema: each issue above names its path, what was found and what was expected."
adversarial = "stop"

[paths_missing]
class       = "path_error"
standard    = "{report}"
route       = "Every path the data names must exist. Report the missing paths to the user."
adversarial = "stop"

[validator_cache_poisoned]
class       = "cache_error"
standard    = "The schema cache failed: {reason}."
route       = "This is a fault in the engine, not in the data. Report this message to the user."
adversarial = "stop"

[tomlx_without_annotations]
class       = "schema_error"
standard    = "'{path}' has no type annotations, so no schema can be derived from it."
route       = "Annotate at least one section with a type, or read the file with read_tomlx_json, which derives no schema."
adversarial = "stop"

[data_not_expressible]
class       = "conversion_error"
standard    = "'{path}' cannot hold this data in its format: {reason}."
route       = "Change the data to what the format can express; the message names what it cannot hold."
adversarial = "stop"

[directory_request_not_json]
class       = "parse_error"
standard    = "The request to write directory '{directory}' is not valid JSON: {reason}."
route       = "Hand over the request as JSON text, serialized by a JSON library."
adversarial = "stop"

[directory_request_invalid]
class       = "validation_error"
standard    = "The request to write directory '{directory}' does not match directory-write-request: {reason}."
route       = "Correct the request to the shape in schemas/tools/directory-write-request.schema.json."
adversarial = "stop"

[directory_paths_refused]
class       = "validation_error"
standard    = "Refused to write directory '{directory}' — {count} path(s) refused:\n  {report}"
route       = "Each file path is relative to the directory and names a file inside it: plain segments, no hidden files, and never the marker."
adversarial = "stop"

[directory_not_generated]
class       = "write_error"
standard    = "Refused to write directory '{directory}': the folder exists and holds no {marker}, so this tool did not write it, and it may hold authored work."
route       = "Write to a folder this tool owns, or ask the user. The marker is placed only by this tool, on a folder it creates."
adversarial = "stop"

[directory_files_refused]
class       = "validation_error"
standard    = "Refused to write directory '{directory}' — {count} file(s) refused:\n  {report}"
route       = "Each refused file is named with its reason; correct those entries."
adversarial = "stop"

[directory_unlistable]
class       = "read_error"
standard    = "Cannot list the directory '{directory}': {reason}."
route       = "Check that the path is right; if it is, ask the user why it cannot be listed."
adversarial = "stop"

[directory_partly_unreadable]
class       = "read_error"
standard    = "Cannot list '{directory}' whole — {count} path(s) could not be read:\n  {report}"
route       = "Each unreadable path is named above; ask the user why they cannot be read."
adversarial = "stop"

[directory_listing_invalid]
class       = "validation_error"
standard    = "The listing of '{directory}' does not match directory-listing: {reason}."
route       = "This is a fault in the reader, not in the directory. Report this message to the user."
adversarial = "stop"

[directory_unwritable]
class       = "write_error"
standard    = "Cannot write directory '{directory}': {reason}."
route       = "Check that the path is the one you were given to write; if it is, ask the user why it cannot be written."
adversarial = "stop"

[directory_report_invalid]
class       = "validation_error"
standard    = "The report for directory '{directory}' does not match directory-write-report: {reason}."
route       = "This is a fault in the writer, not in the request. Report this message to the user."
adversarial = "stop"

[record_absent]
class       = "read_error"
standard    = "Nothing arrived on stdin."
route       = "Pipe the JSON record into {tool}. For data with quotes or apostrophes, use a quoted heredoc: {tool} <<'RECORD', then the record, then RECORD."
adversarial = "stop"

[record_not_json]
class       = "parse_error"
standard    = "The record handed to {tool} is not valid JSON: {reason}."
route       = "Pipe one JSON record on stdin. For data with quotes or apostrophes, use a quoted heredoc: {tool} <<'RECORD', then the record, then RECORD."
adversarial = "stop"

[record_name_not_plain]
class       = "validation_error"
standard    = "The name '{name}' is not a plain file stem: it holds '..' or '/'."
route       = "Pass a plain stem such as entry-123; the writer places it in its own directory."
adversarial = "stop"

[output_exists]
class       = "write_error"
standard    = "Refused to overwrite '{path}': this writer creates new files only."
route       = "Write under a new name, or ask the user whether the existing file is to be replaced."
adversarial = "stop"

[output_not_prepared]
class       = "write_error"
standard    = "'{path}' does not exist; this writer appends only to a file its dispatcher has prepared."
route       = "Ask the user, or the dispatcher that sent you, to prepare the file."
adversarial = "stop"

[output_directory_absent]
class       = "write_error"
standard    = "The output directory '{path}' does not exist; this writer writes only into a directory that is already there."
route       = "Ask the user, or the dispatcher that sent you, to create it."
adversarial = "stop"

[writer_io_failed]
class       = "write_error"
standard    = "The write failed: {reason}."
route       = "Ask the user why the output cannot be written."
adversarial = "stop"

[batch_too_large]
class       = "validation_error"
standard    = "The batch holds {got} records; this writer takes at most {max} per call."
route       = "Split the records into batches of at most {max} and make one call per batch."
adversarial = "stop"

[argument_missing]
class       = "argument_error"
standard    = "{argument} is required."
route       = "Run {tool} --help for the arguments it takes."
adversarial = "stop"

[stamped_field_supplied]
class       = "validation_error"
standard    = "{reason}."
route       = "This writer stamps {fields} itself; leave those fields out of the record."
adversarial = "stop"

[writer_engine_fault]
class       = "write_error"
standard    = "The writer failed after validating the record: {reason}."
route       = "This is a fault in the writer, not in the record. Report this message to the user."
adversarial = "stop"

[embedded_schema_unusable]
class       = "schema_error"
standard    = "The schema '{name}' compiled into this tool is unusable: {reason}."
route       = "The schema is part of the tool. Report this message to the user; the tool is rebuilt with a corrected schema."
adversarial = "stop"
