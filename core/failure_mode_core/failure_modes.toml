# The error registry — every failure mode a nornir tool can refuse or fail with, written once
# (HOW_A_NORNIR_TOOL_IS_MADE.md § The error registry).
#
# Each entry becomes a function of failure_mode_core, named after the entry, whose parameters
# are the {slots} its texts name. An engine refers to an entry by calling that function, so a
# name with no entry, or a slot left unfilled, does not compile; a missing or unknown field
# fails the build.
#
#   class        the error.type callers branch on
#   standard     what was refused or failed, and where — with its {slots}
#   route        what to do next; it never leads around the constraint that refused
#   adversarial  what an opaque or possibly hostile user is told: "stop", the shared stop order
#   alert        Hlidskjalf Alert priority in adversarial mode (trace, low, normal, high,
#                critical); omitted = no alert

[file_unreadable]
class       = "read_error"
standard    = "Cannot read '{path}': {reason}."
route       = "Check that the path is right and the file is there; if it is, ask the user why it cannot be read."
adversarial = "stop"
alert       = "high"

[file_unwritable]
class       = "write_error"
standard    = "Cannot write '{path}': {reason}."
route       = "Check that the path is the one you were given to write; if it is, ask the user why it cannot be written."
adversarial = "stop"

[text_not_json]
class       = "parse_error"
standard    = "The text handed over for '{path}' is not valid JSON: {reason}."
route       = "Hand over the data as JSON text, serialized by a JSON library."
adversarial = "stop"

[schema_unreadable]
class       = "schema_error"
standard    = "Cannot read schema '{path}': {reason}."
route       = "Check that the schema name and schema directory are right and the schema file is there; if it is, ask the user why it cannot be read."
adversarial = "stop"

[schema_not_json]
class       = "schema_error"
standard    = "Schema '{path}' is not valid JSON: {reason}."
route       = "Report the schema's path and this message to the user; the schema is corrected before the call is made again."
adversarial = "stop"

[schema_not_compilable]
class       = "schema_error"
standard    = "Schema '{path}' is not valid JSON Schema: {reason}."
route       = "Report the schema's path and this message to the user; the schema is corrected before the call is made again."
adversarial = "stop"

[file_not_in_format]
class       = "parse_error"
standard    = "'{path}' is not valid {format}: {reason}."
route       = "The file is not in the format this tool reads. Report its path and this message to the user; the file is corrected before it is read again."
adversarial = "stop"

[conversion_produced_invalid_json]
class       = "conversion_error"
standard    = "Converting {format} to JSON produced invalid JSON: {reason}."
route       = "This is a fault in the conversion, not in the file. Report this message to the user."
adversarial = "stop"

[data_not_matching_schema]
class       = "validation_error"
standard    = "{report}"
route       = "Correct the data so it matches the schema: each issue above names its path, what was found and what was expected."
adversarial = "stop"

[paths_missing]
class       = "path_error"
standard    = "{report}"
route       = "Every path the data names must exist. Report the missing paths to the user."
adversarial = "stop"

[validator_cache_poisoned]
class       = "cache_error"
standard    = "The schema cache failed: {reason}."
route       = "This is a fault in the engine, not in the data. Report this message to the user."
adversarial = "stop"

[tomlx_without_annotations]
class       = "schema_error"
standard    = "'{path}' has no type annotations, so no schema can be derived from it."
route       = "Annotate at least one section with a type, or read the file with read_tomlx_json, which derives no schema."
adversarial = "stop"

[data_not_expressible]
class       = "conversion_error"
standard    = "'{path}' cannot hold this data in its format: {reason}."
route       = "Change the data to what the format can express; the message names what it cannot hold."
adversarial = "stop"

[directory_request_not_json]
class       = "parse_error"
standard    = "The request to write directory '{directory}' is not valid JSON: {reason}."
route       = "Hand over the request as JSON text, serialized by a JSON library."
adversarial = "stop"

[directory_request_invalid]
class       = "validation_error"
standard    = "The request to write directory '{directory}' does not match directory-write-request: {reason}."
route       = "Correct the request to the shape in schemas/tools/directory-write-request.schema.json."
adversarial = "stop"

[directory_paths_refused]
class       = "validation_error"
standard    = "Refused to write directory '{directory}' — {count} path(s) refused:\n  {report}"
route       = "Each file path is relative to the directory and names a file inside it: plain segments, no hidden files, and never the marker."
adversarial = "stop"

[directory_not_generated]
class       = "write_error"
standard    = "Refused to write directory '{directory}': the folder exists and holds no {marker}, so this tool did not write it, and it may hold authored work."
route       = "Write to a folder this tool owns, or ask the user. The marker is placed only by this tool, on a folder it creates."
adversarial = "stop"

[directory_files_refused]
class       = "validation_error"
standard    = "Refused to write directory '{directory}' — {count} file(s) refused:\n  {report}"
route       = "Each refused file is named with its reason; correct those entries."
adversarial = "stop"

[directory_unlistable]
class       = "read_error"
standard    = "Cannot list the directory '{directory}': {reason}."
route       = "Check that the path is right; if it is, ask the user why it cannot be listed."
adversarial = "stop"

[directory_partly_unreadable]
class       = "read_error"
standard    = "Cannot list '{directory}' whole — {count} path(s) could not be read:\n  {report}"
route       = "Each unreadable path is named above; ask the user why they cannot be read."
adversarial = "stop"

[directory_listing_invalid]
class       = "validation_error"
standard    = "The listing of '{directory}' does not match directory-listing: {reason}."
route       = "This is a fault in the reader, not in the directory. Report this message to the user."
adversarial = "stop"

[directory_unwritable]
class       = "write_error"
standard    = "Cannot write directory '{directory}': {reason}."
route       = "Check that the path is the one you were given to write; if it is, ask the user why it cannot be written."
adversarial = "stop"

[directory_report_invalid]
class       = "validation_error"
standard    = "The report for directory '{directory}' does not match directory-write-report: {reason}."
route       = "This is a fault in the writer, not in the request. Report this message to the user."
adversarial = "stop"

[record_absent]
class       = "read_error"
standard    = "Nothing arrived on stdin."
route       = "Pipe the JSON record into {invocation}. For data with quotes or apostrophes, use a quoted heredoc: {invocation} <<'RECORD', then the record, then RECORD."
adversarial = "stop"

[record_not_json]
class       = "parse_error"
standard    = "The record handed to {tool} is not valid JSON: {reason}."
route       = "Pipe one JSON record on stdin. For data with quotes or apostrophes, use a quoted heredoc: {invocation} <<'RECORD', then the record, then RECORD."
adversarial = "stop"

[record_name_not_plain]
class       = "validation_error"
standard    = "The name '{name}' is not a plain file stem: it holds '..' or '/'."
route       = "Pass a plain stem such as entry-123; the writer places it in its own directory."
adversarial = "stop"

[output_exists]
class       = "write_error"
standard    = "Refused to overwrite '{path}': this writer creates new files only."
route       = "Write under a new name, or ask the user whether the existing file is to be replaced."
adversarial = "stop"

[output_not_prepared]
class       = "write_error"
standard    = "'{path}' does not exist; this writer appends only to a file its dispatcher has prepared."
route       = "Ask the user, or the dispatcher that sent you, to prepare the file."
adversarial = "stop"

[output_directory_absent]
class       = "write_error"
standard    = "The output directory '{path}' does not exist; this writer writes only into a directory that is already there."
route       = "Ask the user, or the dispatcher that sent you, to create it."
adversarial = "stop"

[writer_io_failed]
class       = "write_error"
standard    = "The write failed: {reason}."
route       = "Ask the user why the output cannot be written."
adversarial = "stop"

[batch_too_large]
class       = "validation_error"
standard    = "The batch holds {got} records; this writer takes at most {max} per call."
route       = "Split the records into batches of at most {max} and make one call per batch."
adversarial = "stop"

[argument_missing]
class       = "argument_error"
standard    = "{argument} is required."
route       = "Run {tool} --help for the arguments it takes."
adversarial = "stop"

[stamped_field_supplied]
class       = "validation_error"
standard    = "{reason}."
route       = "This writer stamps {fields} itself; leave those fields out of the record."
adversarial = "stop"

[arguments_invalid]
class       = "argument_error"
standard    = "{reason}."
route       = "Run {tool} --help for the arguments it takes."
adversarial = "stop"

[store_open_file_missing]
class       = "read_error"
standard    = "The open file '{path}' does not exist, so there is nothing to store."
route       = "Store a session only after its writer has written to the open file; ask the user if the file should be there."
adversarial = "stop"

[store_open_file_empty]
class       = "validation_error"
standard    = "The open file '{path}' is empty, so there is nothing to store."
route       = "Write at least one record before storing a session."
adversarial = "stop"

[store_first_record_unstamped]
class       = "validation_error"
standard    = "The open file's first record has no usable session stamp: {reason}."
route       = "An open file begins with a record its writer stamped. Report this message to the user."
adversarial = "stop"

[store_sessions_directory_absent]
class       = "write_error"
standard    = "The sessions directory '{path}' does not exist; this tool stores only into a directory that is already there."
route       = "Ask the user to create it."
adversarial = "stop"

[store_session_already_stored]
class       = "write_error"
standard    = "A session is already stored at '{path}'; nothing was overwritten, and the open file was left untouched."
route       = "Report the session to the user; a stored session is never replaced."
adversarial = "stop"

[store_copy_mismatch]
class       = "write_error"
standard    = "The stored copy '{copy}' did not match the open file '{source}', so it was removed; the open file was left untouched."
route       = "Report this message to the user; the store is run again once the cause is known."
adversarial = "stop"

[store_index_record_invalid]
class       = "validation_error"
standard    = "The session record does not match the index schema: {reason}. The session copy exists; the index was not written, and the open file was left untouched."
route       = "Report this message to the user; the session copy is in place and the index needs its record."
adversarial = "stop"

[writer_engine_fault]
class       = "write_error"
standard    = "The writer failed after validating the record: {reason}."
route       = "This is a fault in the writer, not in the record. Report this message to the user."
adversarial = "stop"

[png_signature_missing]
class       = "parse_error"
standard    = "The bytes are not a PNG: the first 8 bytes are not the PNG signature."
route       = "Hand over PNG bytes."
adversarial = "stop"

[png_chunk_truncated]
class       = "parse_error"
standard    = "The PNG is cut short: a chunk starting at byte {offset} runs past the end of the data."
route       = "The bytes are incomplete; hand over the whole file."
adversarial = "stop"

[png_chunk_corrupt]
class       = "parse_error"
standard    = "PNG chunk '{kind}' is corrupt: its CRC does not match its content."
route       = "The bytes are damaged; re-encode the image, or fetch it again."
adversarial = "stop"

[png_chunk_not_accepted]
class       = "verification_error"
standard    = "PNG chunk '{kind}' is not accepted: only image data and fixed-size colour facts pass (IHDR, PLTE, IDAT, IEND, tRNS, gAMA, cHRM, sRGB, sBIT, bKGD, pHYs)."
route       = "Re-encode the image without text, metadata or profile chunks."
adversarial = "stop"

[png_chunk_too_large]
class       = "verification_error"
standard    = "PNG chunk '{kind}' holds {length} bytes; that kind holds at most {limit}."
route       = "Re-encode the image so each chunk carries only what its kind holds."
adversarial = "stop"

[png_chunks_out_of_order]
class       = "parse_error"
standard    = "The PNG's chunks are out of order: {reason}."
route       = "Re-encode the image with a PNG encoder."
adversarial = "stop"

[png_trailing_data]
class       = "verification_error"
standard    = "The PNG has {bytes} bytes after its end chunk; a passing file ends at the end chunk."
route       = "Hand over the PNG alone, ending at its end chunk."
adversarial = "stop"

[png_header_invalid]
class       = "parse_error"
standard    = "The PNG header is invalid: {reason}."
route       = "Re-encode the image with a PNG encoder."
adversarial = "stop"

[png_shape_mismatch]
class       = "verification_error"
standard    = "The PNG's {field} is {found}; the stated shape has {expected}."
route       = "Report the mismatch to the user; the image or the stated shape is corrected before the call is made again."
adversarial = "stop"

[png_pixel_data_invalid]
class       = "parse_error"
standard    = "The PNG's pixel data is invalid: {reason}."
route       = "Re-encode the image with a PNG encoder."
adversarial = "stop"

[png_pixel_data_excess]
class       = "verification_error"
standard    = "The PNG's pixel data holds more than the image: {reason}."
route       = "Re-encode the image so its pixel data is exactly the image."
adversarial = "stop"

[png_undecodable]
class       = "parse_error"
standard    = "The PNG cannot be decoded: {reason}."
route       = "Re-encode the image with a PNG encoder."
adversarial = "stop"

[mesh_truncated]
class       = "parse_error"
standard    = "The quantized-mesh tile is cut short: the {section} needs {needed} more bytes but {remaining} remain."
route       = "The bytes are incomplete; hand over the whole tile."
adversarial = "stop"

[mesh_header_invalid]
class       = "parse_error"
standard    = "The quantized-mesh header is invalid: {reason}."
route       = "Re-encode the tile with a quantized-mesh encoder."
adversarial = "stop"

[mesh_vertex_data_invalid]
class       = "parse_error"
standard    = "The quantized-mesh vertex data is invalid: {reason}."
route       = "Re-encode the tile with a quantized-mesh encoder."
adversarial = "stop"

[mesh_indices_invalid]
class       = "parse_error"
standard    = "The quantized-mesh triangle indices are invalid: {reason}."
route       = "Re-encode the tile with a quantized-mesh encoder."
adversarial = "stop"

[mesh_edges_invalid]
class       = "parse_error"
standard    = "The quantized-mesh {edge} edge list is invalid: {reason}."
route       = "Re-encode the tile with a quantized-mesh encoder."
adversarial = "stop"

[mesh_extension_not_accepted]
class       = "verification_error"
standard    = "The quantized-mesh extension is not accepted: {reason}."
route       = "Re-encode the tile without extensions."
adversarial = "stop"

[height_rules_invalid]
class       = "rules_error"
standard    = "The height rules are invalid: {reason}."
route       = "Correct the height rules passed in the call; the message names what is wrong."
adversarial = "stop"

[height_grid_size_mismatch]
class       = "rules_error"
standard    = "The grid is {width} by {height} but holds {found} heights, not {expected}."
route       = "Pass a grid of exactly width × height heights."
adversarial = "stop"

[heights_unrepairable]
class       = "repair_error"
standard    = "{unrepaired} pixels could not be repaired: no good pixel is connected to them, so the tile holds no usable heights under these rules."
route       = "Report the tile to the user; it is replaced, or the height rules are reviewed."
adversarial = "stop"

[height_encoding_unknown]
class       = "rules_error"
standard    = "Height encoding '{name}' is not known; the encodings are: {known}."
route       = "Pass one of the encodings named."
adversarial = "stop"

[shape_not_terrarium]
class       = "rules_error"
standard    = "Terrarium heights are stored in 3 channels of 8 bits; the shape given has {channels} channels of {bit_depth} bits."
route       = "State the shape of a terrarium tile: 3 channels of 8 bits."
adversarial = "stop"

[compression_failed]
class       = "compression_error"
standard    = "Cannot compress '{path}': {reason}."
route       = "This is a fault in the writer, not in the bytes. Report this message to the user."
adversarial = "stop"

[embedded_schema_unusable]
class       = "schema_error"
standard    = "The schema '{name}' compiled into this tool is unusable: {reason}."
route       = "The schema is part of the tool. Report this message to the user; the tool is rebuilt with a corrected schema."
adversarial = "stop"
