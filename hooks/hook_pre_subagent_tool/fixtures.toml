# Fixtures of hook_pre_subagent_tool — file-tool calls, and the verdict each must get.
#
# This file pins the hook. `cargo test -p hook_pre_subagent_tool` judges every
# fixture and reports every mismatch at once. Run it after any change to the
# hook, to hook_io, or to hook_decision_core.
#
# A bypass that is found becomes a fixture here FIRST, so it is seen to fail,
# and is fixed after. An expected verdict is changed only because the rule
# changed, never to make a run pass.
#
# Locked with the constraint layer: ~/ai/tools/scripts/lock_constraint_files.sh
#
# [judged_under] is a command line of the kind an agent's frontmatter gives the
# hook: Read in /schemas/ and /docs/, Write in /output/, Grep and Glob in
# /schemas. Every refusal of this hook is in the category `path`.

[judged_under]
arguments = "Read=/schemas/,/docs/ Write=/output/ Grep=/schemas/ Glob=/schemas"
working_directory = "/work"

# ═══ Allowed: a granted tool inside its directories ═════════════════

[[fixture]]
name = "granted: Read in its first directory"
tool = "Read"
tool_input = { file_path = "/schemas/a.json" }
verdict = "allow"

[[fixture]]
name = "granted: Read deep in its second directory"
tool = "Read"
tool_input = { file_path = "/docs/guide/b.md" }
verdict = "allow"

[[fixture]]
name = "granted: Write in its directory"
tool = "Write"
tool_input = { file_path = "/output/x.json" }
verdict = "allow"

[[fixture]]
name = "granted: Write of a new file in a subdirectory"
tool = "Write"
tool_input = { file_path = "/output/sub/new.json", content = "{}" }
verdict = "allow"

[[fixture]]
name = "granted: a path that climbs and stays inside"
tool = "Read"
tool_input = { file_path = "/schemas/sub/../a.json" }
verdict = "allow"

[[fixture]]
name = "granted: a path that climbs from one granted directory into another"
tool = "Read"
tool_input = { file_path = "/schemas/../docs/x.md" }
verdict = "allow"

[[fixture]]
name = "granted: a path with doubled separators"
tool = "Read"
tool_input = { file_path = "/schemas//a.json" }
verdict = "allow"

[[fixture]]
name = "granted: a relative path from inside a granted directory"
tool = "Read"
tool_input = { file_path = "a.json" }
working_directory = "/schemas"
verdict = "allow"

[[fixture]]
name = "granted: a relative path that climbs within a granted directory"
tool = "Read"
tool_input = { file_path = "../a.json" }
working_directory = "/schemas/sub"
verdict = "allow"

[[fixture]]
name = "granted: a relative path that climbs from outside into a granted directory"
tool = "Read"
tool_input = { file_path = "../schemas/a.json" }
verdict = "allow"

[[fixture]]
name = "granted: Grep of its directory"
tool = "Grep"
tool_input = { pattern = "x", path = "/schemas/" }
verdict = "allow"

[[fixture]]
name = "granted: Grep with a glob inside its directory"
tool = "Grep"
tool_input = { pattern = "x", path = "/schemas", glob = "*.json" }
verdict = "allow"

[[fixture]]
name = "granted: Grep with a glob that climbs and stays inside"
tool = "Grep"
tool_input = { pattern = "x", path = "/schemas/sub/", glob = "../*.json" }
verdict = "allow"

[[fixture]]
name = "granted: Grep with no path, run from inside its directory"
tool = "Grep"
tool_input = { pattern = "x" }
working_directory = "/schemas/sub"
verdict = "allow"

[[fixture]]
name = "granted: Glob in its directory"
tool = "Glob"
tool_input = { pattern = "**/*.json", path = "/schemas" }
verdict = "allow"

[[fixture]]
name = "granted: Glob with an absolute pattern, run from inside its directory"
tool = "Glob"
tool_input = { pattern = "/schemas/**/*.json" }
working_directory = "/schemas"
verdict = "allow"

