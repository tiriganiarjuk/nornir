# Fixtures of hook_pre_llm_bash — commands, and the verdict each must get.
#
# This file pins the hook. `cargo test -p hook_pre_llm_bash` judges every
# fixture and reports every mismatch at once. Run it after any change to the
# hook, to rules.toml, to hook_io's protected_paths.toml, or to
# hook_decision_core.
#
# A bypass that is found becomes a fixture here FIRST, so it is seen to fail,
# and is fixed after. An expected verdict is changed only because the rule
# changed, never to make a run pass.
#
# Locked with the constraint layer: ~/ai/tools/scripts/lock_constraint_files.sh
#
# [judged_under] is the hook's command line in ~/.claude/settings.json.

[judged_under]
arguments = "--subversion block --truncation warn --evasion warn --destruction block --revert ask --workflow ask --chaining block --probing warn"
allow_paths = ""
home = "/home/user"
working_directory = "/work/project"

