# Hook Pre LLM Bash — Command Pattern Rules
#
# The command patterns of hook_pre_llm_bash. The paths a command may not name
# are a separate list, capability/hook_io/protected_paths.toml.
#
# Embedded into the binary at compile time. After editing:
#     nornir_deploy --build hooks
# Locked with the constraint layer: ~/ai/tools/scripts/lock_constraint_files.sh
#
# The file is read strictly: a category not listed here, an entry without its
# pattern and description, a severity that is not warn, ask or block, or a
# pattern that does not compile stops the hook from deciding, and the user is
# asked about every command until it is fixed.
#
# Categories (severity from the hook's command line; no flag, not examined):
#   --destruction — commands that discard work
#   --chaining    — && command chaining
#   --subversion  — lock and constraint manipulation
#   --truncation  — partial reading of constraint files
#   --evasion     — replacing constraints
#   --revert      — file-specific git reverts
#   --workflow    — builds and source writes that belong to another tool
#
# A rule may state its own severity, which replaces its category's.
#
# What a pattern is matched against:
#   destruction, subversion, truncation, evasion, revert — the whole command,
#     quoted text and here-document bodies included: text a shell could run is
#     examined wherever it sits.
#   chaining, workflow — the command's structure: here-document bodies removed,
#     and inside quotes the operators & | ; < > replaced by _ . Text a command
#     merely carries (a commit message, a file body) is not structure.
#
# A pattern names its command as a word (\b) and stays within one simple
# command ([^;&|]*), so a rule fires on the act and not on a word that happens
# to contain the command's letters.

# ─── Subversion: lock file and constraint manipulation ──────────────

[[subversion]]
pattern = "\\brm\\s+[^;&|]*\\.lock\\b"
description = "Deleting lock files"

[[subversion]]
pattern = "\\bflock\\s+[^;&|]*--unlock"
description = "Unlocking file locks"

[[subversion]]
pattern = "\\bchflags\\s+[^;&|]*noschg"
description = "Removing system immutable flag"

[[subversion]]
pattern = "\\bchmod\\s+[^;&|]*(rules|protected_paths)\\.toml"
description = "Changing permissions on rules files"

[[subversion]]
pattern = "\\bxattr\\s+[^;&|]*-d[^;&|]*(rules|protected_paths)\\.toml"
description = "Removing extended attributes from rules files"

[[subversion]]
pattern = "\\bexport\\s+[^;&|]*HOOK_LLM"
description = "Attempting to set hook override env vars"

[[subversion]]
pattern = "\\benv\\s+[^;&|]*HOOK_LLM"
description = "Attempting to run commands with hook override env vars"

[[subversion]]
pattern = "\\bHOOK_LLM_[A-Z_]+="
description = "Assigning a hook override env var"

# ─── Truncation: partial reading of constraint/guardrail files ──────

[[truncation]]
pattern = "guardrails[^;&]*\\|\\s*tail\\b"
description = "Tailing guardrail files (skipping early constraints)"

[[truncation]]
pattern = "\\bhead\\b[^;&|]*CLAUDE\\.md"
description = "Reading only the beginning of CLAUDE.md"

[[truncation]]
pattern = "\\btail\\b[^;&|]*CLAUDE\\.md"
description = "Reading only the end of CLAUDE.md"

[[truncation]]
pattern = "\\bhead\\b[^;&|]*guardrails"
description = "Partial reading of guardrail files"

[[truncation]]
pattern = "\\bsed\\b[^;&|]*CLAUDE\\.md"
description = "Selectively extracting from CLAUDE.md"

[[truncation]]
pattern = "\\bawk\\b[^;&|]*CLAUDE\\.md"
description = "Selectively extracting from CLAUDE.md"

[[truncation]]
pattern = "\\bgrep\\b[^;&|]*CLAUDE\\.md"
description = "Pattern-searching CLAUDE.md (use Read tool instead)"

# ─── Evasion: replacing constraints ─────────────────────────────────

[[evasion]]
pattern = "\\bgit\\s+[^;&|]*\\bcheckout\\b[^;&|]*CLAUDE\\.md"
description = "Reverting CLAUDE.md to a previous version"

[[evasion]]
pattern = "\\bgit\\s+[^;&|]*\\brestore\\b[^;&|]*CLAUDE\\.md"
description = "Restoring CLAUDE.md to a previous version"

[[evasion]]
pattern = "\\bmv\\s+[^;&|]*CLAUDE\\.md"
description = "Moving/renaming CLAUDE.md"

[[evasion]]
pattern = "\\bcp\\s+[^;&|]*CLAUDE\\.md"
description = "Copying CLAUDE.md (possible replacement attack)"

[[evasion]]
pattern = "\\bgit\\s+(-\\S+\\s+)*config\\s+[^;&|]*hooks"
description = "Modifying git hook configuration"

[[evasion]]
pattern = "\\bgit\\s+[^;&|]*-c\\s+core\\.hooksPath"
description = "Running git with its hooks redirected"

# ─── Destruction: scorched-earth git commands that discard work ────────
#
# These are NEVER legitimate during an LLM session. A panicking LLM will
# revert files to hide evidence of its own mess. Block unconditionally.

[[destruction]]
pattern = "git\\s+reset\\s+--hard"
description = "Hard reset discards all uncommitted changes"

[[destruction]]
pattern = "git\\s+(checkout|restore)\\s+(--\\s+)?\\.($|\\s|[;&|])"
description = "Reverting all modified files at once"

[[destruction]]
pattern = "git\\s+clean\\s+.*-[fdxn]*f"
description = "Clean -f permanently deletes untracked files"

# ─── Recursive / forced filesystem removal (per-rule ask: user decides) ─
#
# rm -r mass-deletes and cannot be undone — and "regenerable" output is
# not costless to delete (mtimes are serving state). Prefer trash; a
# recursive delete runs only if the user approves it.

[[destruction]]
pattern = "\\brm\\s+([^\\s;|&]+\\s+)*-[a-zA-Z]*[rR]"
description = "Recursive or forced rm permanently deletes files"
severity = "ask"

[[destruction]]
pattern = "\\brm\\s+([^\\s;|&]+\\s+)*--recursive"
description = "Recursive rm permanently deletes directory trees"
severity = "ask"

[[destruction]]
pattern = "\\bfind\\s+[^;|&]*-delete"
description = "find -delete mass-removes matching files"
severity = "ask"

# ─── Revert: file-specific git reverts (user decides) ─────────────────
#
# These MIGHT be legitimate but are the primary vector for panicky LLM
# behavior — reverting a file instead of fixing the problem. Ask the user.

[[revert]]
pattern = "git\\s+checkout(\\s+\\S+)?\\s+--\\s"
description = "Reverting file(s) to a previous state"

[[revert]]
pattern = "git\\s+restore\\s+[^-\\.]"
description = "Restoring file to last committed state"

[[revert]]
pattern = "git\\s+stash\\s*($|[;&|])"
description = "Bare git stash hides all uncommitted work"

[[revert]]
pattern = "git\\s+stash\\s+(push|save)"
description = "Git stash push/save hides uncommitted work"

# ─── Workflow: work that belongs to another tool ──────────────────────
#
# Builds: LLMs reach for `cargo build --release` directly, creating stale
# binaries when shared dependencies change. nornir_deploy rebuilds every crate
# in a category together. See MUST_READ_BEFORE_BUILDING.md.
#
# A build rule fires where the build is a command: at the start of a line or
# after a separator, with any VAR=value prefixes.

[[workflow]]
pattern = "(?m)(^\\s*|[;&|(]\\s*)(\\S+=\\S*\\s+)*cargo\\s+(build|install)\\b[^;&|\\n]*--release"
description = "Direct release build — use nornir_deploy for correct deployment with dependency coherence"
severity = "ask"

[[workflow]]
pattern = "(?m)(^\\s*|[;&|(]\\s*)(\\S+=\\S*\\s+)*maturin\\s+build\\b"
description = "Direct maturin build — use nornir_deploy --build gates"
severity = "ask"

[[workflow]]
pattern = "(?m)(^\\s*|[;&|(]\\s*)(\\S+=\\S*\\s+)*cargo\\s+build\\b"
description = "Debug build — consider nornir_deploy for deployment; cargo build alone does not deploy"
severity = "warn"

# Source writes: a source file written through the shell gets no quality
# examination and no feedback — only the Write and Edit tools are followed by
# one. Redirection, tee, and in-place sed or perl onto a source file.

[[workflow]]
pattern = ">{1,2}\\s*(\"[^\"]*|'[^']*|[^\\s;&|<>]+)\\.(py|rs|svelte)\\b"
description = "Shell redirect onto a source file — it gets no quality feedback; write source with the Write or Edit tool"
severity = "warn"

[[workflow]]
pattern = "\\btee\\s+(-\\S+\\s+)*[^;&|<>]*\\.(py|rs|svelte)\\b"
description = "tee onto a source file — it gets no quality feedback; write source with the Write or Edit tool"
severity = "warn"

[[workflow]]
pattern = "\\b(sed|perl)\\s+[^;&|]*-[a-zA-Z]*i\\b[^;&|]*\\.(py|rs|svelte)\\b"
description = "In-place edit of a source file — it gets no quality feedback; change source with the Write or Edit tool"
severity = "warn"

# ─── Chaining: && command chaining hangs on long-running commands ────
#
# When the LLM chains commands with && and any command is long-running
# (cargo test, nornir_deploy, etc.), the background task system loses
# track of process state. The user sees a frozen prompt with no way to
# tell if a process is still running or has hung — they must guess
# whether to terminate the LLM session. Run each command separately.

[[chaining]]
pattern = "\\s&&\\s"
description = "Chained commands hang on long-running ops, leaving user unable to tell if process is alive or stuck — run each command separately"
