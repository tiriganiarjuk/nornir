# Crate-to-category mapping for nornir_deploy.
#
# Each table is a deploy category. The fields nornir_deploy reads, and what each
# means, are in MUST_READ_BEFORE_BUILDING.md § deploy_categories.toml Reference.

[hooks]
crates = [
    "hook_pre_subagent_tool",
    "hook_pre_subagent_bash",
    "hook_pre_llm_tool",
    "hook_pre_llm_bash",
    "hook_post_llm_tool",
    "hook_post_llm_read",
]
verify = "stdin"
verify_input = '{"tool_name":"Test","tool_input":{}}'

# The hooks that act on a session event. Run with nothing on stdin, each refuses
# for want of its event and exits 1 — which proves it loads and checks its input,
# and has no effect.
[session_hooks]
crates = [
    "hook_stop_llm_tts",
    "hook_notify_llm_tts",
    "hook_compact_session_log",
    "hook_session_start_orient",
    "hook_session_start_inject",
    "hook_session_end_handoff",
]
verify = "exit_codes"
valid_exit_codes = [1]

[writers]
crates = [
    "append_truth_qc_report_record",
    "write_truth_glossary_record",
    "append_embedding_normalize_batch_20",
    "append_interview_summaries_record",
    "append_raw_jsonl",
    "append_forseti_interview_exchange_record",
    "store_forseti_interview_session",
    "append_bragi_interview_exchange_record",
    "store_bragi_interview_session",
]
verify = "help"

[senders]
crates = [
    "send_heartbeat",
    "send_notification",
    "send_warning",
    "send_alert",
    "send_datagram",
]
verify = "exit_codes"
valid_exit_codes = [0, 1, 2]

[tools]
crates = [
    "saga_cli",
    "syn_cli",
    "hush",
    "announce",
    "cc_launch",
    "dep_resolve_file",
    "dep_resolve_function",
]
verify = "exit_codes"
valid_exit_codes = [0, 1, 2]
# These crates produce binaries with different names
[tools.binary_names]
saga_cli = "saga"
syn_cli = "syn"

[converters]
crates = [
    "convert_json_to_toml",
    "convert_json_to_yaml",
]
verify = "stdin"
verify_input = '{"test": true}'

[dispatchers]
crates = [
    "split_jsonl_batches",
]
verify = "help"

[watchers]
crates = [
    "watch_and_diff_exchange_intercepts",
]
verify = "exit_codes"
valid_exit_codes = [2]

[rewriters]
crates = [
    "rewrite_compaction_summary",
]
verify = "stdin"
verify_input = '{"system":[],"tools":[],"messages":[]}'

[daemons]
crates = [
    "record_datagrams",
    "relay_mic_to_voice",
    "bifrost_proxy",
]
verify = "help"

[interceptors]
crates = [
    "intercept_replay",
]
verify = "help"
pyo3_crates = [
    "traffic_interceptor_rewriter",
]
python_version = "python3.13"

[gates]
python_version = "python3.13"
gate_crates = [
    "gate_raw_definition_input",
    "gate_raw_definition_defaults",
    "gate_paths_verified_input",
    "gate_includes_merged_input",
    "gate_permissions_resolved_input",
    "gate_universal_format_input",
    "gate_universal_render_input",
    "gate_anthropic_render_input",
    "gate_guardrails_reduced_input",
    "gate_success_reduced_input",
    "gate_criteria_merged_input",
    "gate_instructions_reduced_input",
    "gate_examples_reduced_input",
    "gate_execution_merged_input",
    "gate_paths_resolved_output",
    "gate_includes_merged_output",
    "gate_permissions_resolved_output",
    "gate_universal_format_output",
    "gate_universal_render_output",
    "gate_anthropic_render_output",
    "gate_guardrails_reduced_output",
    "gate_success_reduced_output",
    "gate_criteria_merged_output",
    "gate_instructions_reduced_output",
    "gate_examples_reduced_output",
    "gate_execution_merged_output",
    "gate_paths_verified",
    "gate_include_success_criteria_input",
    "gate_include_failure_criteria_input",
    "gate_include_execution_instructions_input",
    "gate_include_example_entries_input",
    "gate_include_example_group_input",
    "gate_include_guardrails_constraints_input",
    "gate_include_guardrails_anti_patterns_input",
    "gate_output_structure_input",
    "gate_output_content_input",
    "gate_output_display_input",
]

[readers]
python_version = "python3.13"
pyo3_crates = [
    "read_json_validate_json",
    "read_yaml_validate_json",
    "read_toml_validate_json",
    "read_toon_validate_json",
    "read_xml_validate_json",
    "read_markdown_validate_json",
    "read_tomlx_json",
    "read_tomlx_json_schema",
    "read_tomlx_validate_json",
    "read_directory_json",
    "read_directory_permitted_json",
]

[text_writers]
python_version = "python3.13"
pyo3_crates = [
    "write_json_validate_json",
    "write_json_validate_toml",
    "write_json_validate_yaml",
    "write_json_validate_toon",
    "write_json_validate_xml",
    "write_json_validate_markdown",
    "write_json_validate_directory",
]

[presence]
python_version = "python3.13"
pyo3_crates = [
    "create_flag_generate_lock",
    "remove_flag_generate_lock",
]

[binary_readers]
python_version = "python3.13"
pyo3_crates = [
    "read_png_verify_heights",
]

[binary_writers]
python_version = "python3.13"
pyo3_crates = [
    "write_bytes_verify_png",
    "write_bytes_verify_quantized_mesh",
]
